<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="aarons personal inspiration archive." />
    <title>aarons inspo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#10100f; --paper:#efede5; --muted:#96948d; --accent:#ff431f; --line:rgba(239,237,229,.2); }
      * { box-sizing:border-box; }
      html { background:var(--ink); scroll-behavior:smooth; }
      body { margin:0; background:var(--ink); color:var(--paper); font-family:"DM Mono",monospace; font-size:12px; letter-spacing:.025em; }
      a { color:inherit; text-decoration:none; }
      .page { overflow:hidden; }
      .nav { height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; border-bottom:1px solid var(--line); }
      .wordmark { font-size:15px; letter-spacing:.015em; }
      .wordmark i { font-family:"Instrument Serif",serif; font-size:19px; font-weight:400; }
      .nav-link { color:var(--accent); }
      .intro { min-height:284px; display:grid; grid-template-columns:minmax(0, 1fr) 240px; gap:36px; padding:62px 32px 46px; border-bottom:1px solid var(--line); }
      h1 { margin:0; max-width:850px; font-family:"Instrument Serif",serif; font-size:clamp(56px,8.3vw,118px); font-weight:400; line-height:.8; letter-spacing:-.06em; }
      .intro-copy { align-self:end; margin:0; max-width:230px; color:var(--muted); line-height:1.6; }
      .intro-copy b { color:var(--paper); font-weight:500; }
      .reveal-wrap { padding:0; background:#171715; }
      .reveal { --flash-x:50%; --flash-y:50%; position:relative; aspect-ratio:16 / 9; overflow:hidden; background:#20201d; cursor:crosshair; isolation:isolate; }
      .reveal::after { content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:rgba(4,4,3,.6); transition:background .15s ease-out; }
      .reveal.is-active::after { background:radial-gradient(circle 170px at var(--flash-x) var(--flash-y), rgba(4,4,3,0) 0, rgba(4,4,3,.04) 34%, rgba(4,4,3,.64) 76%, rgba(4,4,3,.72) 100%); }
      .collage { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(.88) contrast(1.03); }
      .hint { position:absolute; z-index:2; left:16px; bottom:15px; color:var(--paper); opacity:.86; pointer-events:none; transition:opacity .25s; }
      .reveal.is-active .hint { opacity:0; }
      .footer { padding:22px 32px 30px; display:flex; justify-content:space-between; color:var(--muted); }
      .footer span:last-child { color:var(--accent); }
      @media (max-width:700px) { .nav { padding:0 17px; }.intro { min-height:335px; grid-template-columns:1fr; gap:22px; padding:46px 17px 36px; }.intro-copy { max-width:280px; }.reveal { aspect-ratio:auto; min-height:62svh; }.footer { padding:18px 17px 25px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="nav">
        <a class="wordmark" href="#top">aaron <i>z.</i></a>
        <a class="nav-link" href="#inspiration">inspiration</a>
      </nav>
      <section id="top" class="intro">
        <h1>Things I keep<br /><em>returning to.</em></h1>
        <p class="intro-copy"><b></b><br /></p>
      </section>
      <section class="reveal-wrap">
        <div class="reveal" id="reveal-area">
          <img class="collage" src="inspo%20collage.png" alt="Aaron's inspiration collage" />
          <span class="hint">move to reveal</span>
        </div>
      </section>
      <footer class="footer"><span>© aaron z.</span><span>inspiration archive</span></footer>
    </main>
    <script>
      const reveal = document.querySelector('#reveal-area');
      reveal.addEventListener('pointermove', (event) => {
        const bounds = reveal.getBoundingClientRect();
        reveal.style.setProperty('--flash-x', `${event.clientX - bounds.left}px`);
        reveal.style.setProperty('--flash-y', `${event.clientY - bounds.top}px`);
      });
      reveal.addEventListener('pointerenter', () => {
        reveal.classList.add('is-active');
      });
      reveal.addEventListener('pointerleave', () => {
        reveal.classList.remove('is-active');
      });
    </script>
  </body>
</html>
